plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mojtaba.madrese'
    compileSdk 34

    defaultConfig {
        applicationId "com.mojtaba.madrese"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    flavorDimensions "app"
    productFlavors {
        school {
            dimension "app"
            applicationId "com.mojtaba.madrese.school"
            resValue "string", "app_name", "سامانه مدرسه"
        }
        mother {
            dimension "app"
            applicationId "com.mojtaba.madrese.mother"
            resValue "string", "app_name", "پنل مادر"
        }
    }
buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file("nikan-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
}
